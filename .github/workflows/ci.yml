# CI for pull requests, manual runs and reuse from other workflows (workflow_call).
#
# Draft PRs: the `plan` job is skipped, and every other job needs it, so nothing runs.
# `ci-ok` has `if: always()` and fails unless lint, test, docs and e2e all succeeded,
# so a draft PR shows it red. Mark the PR ready for review to run the real checks.
# `ci-ok` is the single required status check of the branch protection.
#
# workflow_call input `full` (default true): false runs only the `smoke` rows of matrix.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run the whole matrix (false runs only the smoke rows)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = "false" ]; then
            filter='map(select(.smoke))'
          else
            filter='.'
          fi
          echo "matrix=$(jq -c "$filter" matrix.json)" >> "$GITHUB_OUTPUT"

  lint:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: test (airflow ${{ matrix.airflow }}, python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }}
      # The lock holds Airflow 3; drop it first so no airflow-core/task-sdk files linger under a 2.x row.
      - run: |
          uv pip uninstall apache-airflow apache-airflow-core apache-airflow-task-sdk
          uv pip install "apache-airflow==${{ matrix.airflow }}"
          uv pip check
      - run: uv run --no-sync pytest -q

  docs:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - run: pip install -r docs/site/requirements.txt
      - run: cp CHANGELOG.md docs/site/changelog.md
      - run: mkdocs build --strict

  e2e:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            executor: spark:4.2.0-python3
          - python: "3.14"
            executor: ghcr.io/sdaberdaku/spark:4.2.0-python3.14
    name: e2e (python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: helm repo add apache-airflow https://airflow.apache.org
      - env:
          PYTHON_VERSION: ${{ matrix.python }}
          EXECUTOR_IMAGE: ${{ matrix.executor }}
        run: bash e2e/run.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-dump-python${{ matrix.python }}
          path: e2e/out
          if-no-files-found: ignore

  ci-ok:
    needs: [lint, test, docs, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: test
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
